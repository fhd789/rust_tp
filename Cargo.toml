[package]
name = "kernel-rust-slab-Fahed-MASAD"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader_api = "0.11"
x86_64 = "0.15"
spin = "0.9"
volatile = "0.4"
uart_16550 = "0.3"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
pic8259 = "0.10"

[dependencies.linked_list_allocator]
version = "0.10"
optional = true

[dev-dependencies]
bootloader = "0.11"

[features]
# Enable extra diagnostics in allocators and interrupts.
trace = []
# Use linked_list_allocator for comparison/debugging.
ll_alloc = ["linked_list_allocator"]
